<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDSTAR NEXUS</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --term-green: #00ff41;
            --term-dim: #008F11;
            --glass: rgba(0, 20, 0, 0.7);
        }
        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 800px;
            padding: 2rem;
            border: 1px solid var(--term-dim);
            background: var(--glass);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            position: relative;
        }
        /* Scanline effect */
        .container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        h1 {
            letter-spacing: 5px;
            border-bottom: 2px solid var(--term-dim);
            padding-bottom: 10px;
            text-shadow: 0 0 5px var(--term-green);
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        .output-screen {
            background: #000;
            border: 1px solid var(--term-dim);
            padding: 20px;
            height: 150px;
            margin: 20px 0;
            font-size: 1.2rem;
            line-height: 1.5;
            color: #fff; /* White text for readability */
            text-shadow: 0 0 2px var(--term-green);
        }
        button {
            background: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            padding: 10px 30px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover {
            background: var(--term-green);
            color: #000;
            box-shadow: 0 0 15px var(--term-green);
        }
        .status {
            font-size: 0.8rem;
            color: var(--term-dim);
            margin-top: 10px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WORDSTAR <span class="blink">NEXUS</span> // QUANTUM MUSE</h1>
    
    <p>System Status: <span id="sys-status">CONNECTED</span></p>
    <p>Superposition: <span id="q-state">STABLE</span></p>

    <div class="output-screen" id="output">
        Awaiting initialization...
    </div>

    <button onclick="generateEntropy()">COLLAPSE WAVE FUNCTION</button>

    <div class="status" id="log">
        Tunnel: Active | Encryption: Quantum-256
    </div>
</div>

<script>
    async function generateEntropy() {
        const output = document.getElementById('output');
        const log = document.getElementById('log');
        
        // 1. Visual Effect
        output.innerHTML = "<span class='blink'>...Accessing Quantum Processor...</span>";
        log.innerText = "Tunnel: Transmitting Request...";

        try {
            // 2. The Fetch Call
            // REPLACE THIS URL WITH YOUR RENDER URL LATER
            const response = await fetch('https://wordstar-backend.onrender.com/generate'); 
            
            if (!response.ok) throw new Error("Quantum Decoherence Detected");
            
            const data = await response.json();

            // 3. Display Result
            output.innerText = data.muse;
            log.innerText = "Tunnel: Response Received | State: " + data.status;
            
        } catch (error) {
            output.innerText = "ERROR: Connection to Quantum Cloud Failed.";
            log.innerText = "Tunnel: OFFLINE";
            console.error(error);
        }
    }
</script>

</body>
</html>
